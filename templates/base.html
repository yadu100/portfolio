<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {% load static %}

    <link rel="stylesheet" href="{% static 'styles/style.css' %}">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Birthstone&family=New+Amsterdam&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Sedan:ital@0;1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&family=Jersey+10&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Khand:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <title>yd - portfolio</title>
</head>
<body style="background-image: linear-gradient(#4b6cc11a, #fff 100vh);">

    {% block nav %}
    <nav class="navbar navbar-expand-md navbar-light px-5">
        <a class="navbar-brand" href="{% url 'About' %}">
            <img src="{% static 'images/logo.png' %}" alt="My Logo" width="75px">
        </a>

        <button class="navbar-toggler" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item {% block nav_about %}{% endblock %}">
                    <a class="nav-link new-amsterdam-regular mx-2" href="{% url 'About' %}">About</a>
                </li>
                <li class="nav-item {% block nav_work %}{% endblock %}">
                    <a class="nav-link new-amsterdam-regular mx-2" href="{% url 'work' %}">Work</a>
                </li>
                <li class="nav-item {% block nav_project %}{% endblock %}">
                    <a class="nav-link new-amsterdam-regular mx-2" href="{% url 'project' %}">Projects</a>
                </li>
                <li class="nav-item {% block nav_articles %}{% endblock %}">
                    <a class="nav-link new-amsterdam-regular mx-2" href="{% url 'articles' %}">Articles</a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'contact' %}" class="nav-link new-amsterdam-regular mx-2 border border-primary {% block nav_contact_style %}text-primary{% endblock %} rounded-pill text-center">Say Hello</a>
                </li>
            </ul>
        </div>
    </nav>
    {% endblock %}

    {% block content %}
    {% endblock %}

    {% block footer %}
    <div class="container">
        <br>
        <hr class="bg-secondary">
        <p class="text-left"><i class="bi bi-c-circle" style="font-size: 20px;"></i> {{ current_year }} <strong>Yadu</strong></p>
        <br>
    </div>
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
</body>
</html>
